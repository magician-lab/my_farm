{% extends "base_erp.html" %}
{% block title %}Edit Milk Record{% endblock %}
{% block page_title %}Edit Milk Record{% endblock %}
{% block content %}
<h2>Edit Milk Record (Milking Sessions)</h2>

<form method="POST">

    <p><strong>Cow:</strong> {{ record.cow.name if record.cow else record.cow_id }}</p>
    <p><strong>Date:</strong> {{ record.date }}</p>

    <label>Session 1 (L):</label>
    <input type="number" step="0.01" name="session_1"
           value="{{ record.session_1 if record.session_1 is not none else record.morning }}"><br><br>

    <label>Session 2 (L):</label>
    <input type="number" step="0.01" name="session_2"
           value="{{ record.session_2 if record.session_2 is not none else record.noon }}"><br><br>

    <label>Session 3 (L):</label>
    <input type="number" step="0.01" name="session_3"
           value="{{ record.session_3 if record.session_3 is not none else record.evening }}"><br><br>

    <button type="submit">Update</button>

</form>
{% endblock %}
